<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генеалогическое древо тейпа Хачиро</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0808;
            color: #e0d5c0;
            overflow: hidden;
            height: 100vh;
        }
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(10, 8, 8, 0.92);
            padding: 12px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #b8860b;
            backdrop-filter: blur(8px);
        }
        #header h1 {
            font-size: 20px;
            letter-spacing: 2px;
            color: #d4a843;
            margin-right: 20px;
            font-weight: 300;
        }
        #header input,
        #header select,
        #header button {
            padding: 8px 14px;
            border-radius: 6px;
            border: 1px solid #5a4a2a;
            background: #1a150e;
            color: #e0d5c0;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }
        #header input:focus,
        #header select:focus {
            border-color: #d4a843;
            box-shadow: 0 0 12px rgba(212, 168, 67, 0.2);
        }
        #header input::placeholder {
            color: #6a5a3a;
        }
        #header button {
            background: #2a1f0e;
            cursor: pointer;
            border-color: #b8860b;
        }
        #header button:hover {
            background: #3d2d14;
        }
        .admin-btn {
            margin-left: auto;
            background: #3d1a0a !important;
            border-color: #8b3a1a !important;
        }
        #stats {
            color: #8a7a5a;
            font-size: 13px;
            margin-left: 10px;
        }
        #canvas-wrapper {
            position: fixed;
            top: 80px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        #treeCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        #treeCanvas:active {
            cursor: grabbing;
        }
        #tooltip {
            position: fixed;
            display: none;
            background: rgba(20, 15, 10, 0.95);
            border: 1px solid #b8860b;
            border-radius: 10px;
            padding: 14px 20px;
            min-width: 180px;
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
        }
        #tooltip .name {
            font-size: 20px;
            color: #d4a843;
            font-weight: 600;
        }
        #tooltip .family {
            font-size: 14px;
            color: #aa9a7a;
            margin-top: 4px;
        }
        #tooltip .lineage {
            font-size: 12px;
            color: #8a7a5a;
            margin-top: 6px;
            border-top: 1px solid #3a2a1a;
            padding-top: 6px;
        }
        #admin-panel {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 150;
            display: none;
            background: rgba(10, 8, 8, 0.96);
            border: 1px solid #b8860b;
            border-radius: 14px;
            padding: 24px;
            min-width: 300px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.9);
        }
        #admin-panel.active {
            display: block;
        }
        #admin-panel h3 {
            color: #d4a843;
            margin-bottom: 16px;
            font-weight: 300;
            letter-spacing: 1px;
        }
        #admin-panel label {
            display: block;
            margin: 10px 0 4px;
            color: #aa9a7a;
            font-size: 13px;
        }
        #admin-panel select,
        #admin-panel input {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #3a2a1a;
            background: #1a150e;
            color: #e0d5c0;
            font-size: 14px;
        }
        #admin-panel button {
            margin-top: 14px;
            width: 100%;
            padding: 10px;
            background: #2a1f0e;
            border: 1px solid #b8860b;
            border-radius: 6px;
            color: #d4a843;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        #admin-panel button:hover {
            background: #3d2d14;
        }
        .close-admin {
            position: absolute;
            top: 10px;
            right: 16px;
            background: none;
            border: none;
            color: #8a5a3a;
            font-size: 24px;
            cursor: pointer;
        }
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        #login-overlay.hidden {
            display: none;
        }
        #login-box {
            background: rgba(20, 15, 10, 0.96);
            border: 1px solid #b8860b;
            border-radius: 16px;
            padding: 40px;
            min-width: 320px;
            text-align: center;
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.9);
        }
        #login-box h2 {
            color: #d4a843;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }
        #login-box input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3a2a1a;
            background: #1a150e;
            color: #e0d5c0;
            font-size: 16px;
            margin-bottom: 16px;
        }
        #login-box button {
            width: 100%;
            padding: 12px;
            background: #2a1f0e;
            border: 1px solid #b8860b;
            border-radius: 8px;
            color: #d4a843;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }
        #login-box button:hover {
            background: #3d2d14;
        }
        #login-error {
            color: #b84a3a;
            margin-top: 12px;
            font-size: 14px;
            display: none;
        }
        @media (max-width: 768px) {
            #header h1 {
                font-size: 16px;
                margin-right: 10px;
            }
            #header input,
            #header select {
                width: 100%;
            }
            #admin-panel {
                bottom: 10px;
                right: 10px;
                left: 10px;
                min-width: unset;
            }
            #login-box {
                min-width: unset;
                width: 90%;
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Логин -->
    <div id="login-overlay">
        <div id="login-box">
            <h2>⚔️ Тейп Хачиро</h2>
            <input type="password" id="loginPass" placeholder="Введите пароль доступа">
            <button onclick="checkLogin()">Войти в древо</button>
            <div id="login-error">Неверный пароль</div>
        </div>
    </div>

    <!-- Верхняя панель -->
    <div id="header">
        <h1>🌳 Хачиро</h1>
        <input type="text" id="searchInput" placeholder="Поиск по имени..." oninput="searchByName(this.value)">
        <select id="familyFilter" onchange="filterByFamily(this.value)">
            <option value="">Все семьи (гары)</option>
        </select>
        <button onclick="resetView()">🔄 Сброс</button>
        <span id="stats">0 человек</span>
        <button class="admin-btn" onclick="toggleAdmin()">⚙️ Админ</button>
    </div>

    <!-- Холст для дерева -->
    <div id="canvas-wrapper">
        <canvas id="treeCanvas"></canvas>
    </div>

    <!-- Подсказка при наведении -->
    <div id="tooltip">
        <div class="name" id="tipName">—</div>
        <div class="family" id="tipFamily">—</div>
        <div class="lineage" id="tipLineage">—</div>
    </div>

    <!-- Админ-панель -->
    <div id="admin-panel">
        <button class="close-admin" onclick="toggleAdmin()">✕</button>
        <h3>⚙️ Добавить сына</h3>
        <label>Отец</label>
        <select id="fatherSelect"></select>
        <label>Имя сына</label>
        <input type="text" id="newSonName" placeholder="Введите имя">
        <label>Семья (гар) сына</label>
        <input type="text" id="newSonFamily" placeholder="Напр. Адаговы">
        <button onclick="addSon()">➕ Добавить</button>
        <hr style="border-color: #2a1f0e; margin: 16px 0;">
        <h3>✏️ Редактировать</h3>
        <label>Выбрать человека</label>
        <select id="editSelect"></select>
        <label>Новое имя</label>
        <input type="text" id="editName" placeholder="Новое имя">
        <label>Новая семья</label>
        <input type="text" id="editFamily" placeholder="Новая семья">
        <button onclick="editPerson()">💾 Сохранить</button>
    </div>

    <script>
        // ============================================================
        // 1. ДАННЫЕ (здесь ты заменишь на свои 800+ человек)
        // ============================================================
        let people = [
            // Корень
            { id: 'p1', name: 'Эли', family: 'Цуцаевы', fatherId: null },
            // Ветвь Цуцаевых
            { id: 'p2', name: 'Марс', family: 'Мирзоевы', fatherId: 'p1' },
            { id: 'p3', name: 'Умар', family: 'Цуцаевы', fatherId: 'p1' },
            // Ветвь Мирзоевых
            { id: 'p4', name: 'Адаг', family: 'Адаговы', fatherId: 'p2' },
            { id: 'p5', name: 'Абдул', family: 'Мирзоевы', fatherId: 'p2' },
            { id: 'p6', name: 'Руслан', family: 'Мирзоевы', fatherId: 'p5' },
            // Ветвь Адаговых
            { id: 'p7', name: 'Ваха', family: 'Адаговы', fatherId: 'p4' },
            { id: 'p8', name: 'Лечи', family: 'Адаговы', fatherId: 'p4' },
            { id: 'p9', name: 'Хасан', family: 'Адаговы', fatherId: 'p4' },
            { id: 'p10', name: 'Сайд', family: 'Адаговы', fatherId: 'p7' },
            { id: 'p11', name: 'Магомед', family: 'Адаговы', fatherId: 'p7' },
            { id: 'p12', name: 'Ахмед', family: 'Цуцаевы', fatherId: 'p3' },
            { id: 'p13', name: 'Рамзан', family: 'Цуцаевы', fatherId: 'p3' },
            // Еще для примера связи между семьями
            { id: 'p14', name: 'Муса', family: 'Мирзоевы', fatherId: 'p6' },
            { id: 'p15', name: 'Иса', family: 'Адаговы', fatherId: 'p11' },
        ];

        // Цвета для семей (гаров)
        const familyColors = {
            'Цуцаевы': '#b87333',
            'Мирзоевы': '#2a6b5a',
            'Адаговы': '#8b3a5a',
            // Добавишь свои
        };

        // ============================================================
        // 2. СОСТОЯНИЕ
        // ============================================================
        let selectedId = null;
        let highlightIds = new Set();
        let dimFamily = null;
        let scale = 1;
        let offsetX = 0,
            offsetY = 0;
        let isDragging = false;
        let dragStartX, dragStartY, dragStartOffX, dragStartOffY;
        let canvas, ctx;
        let nodePositions = new Map();
        const NODE_W = 120,
            NODE_H = 44;
        const LVL_GAP = 80,
            NODE_GAP = 16;

        // ============================================================
        // 3. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        function init() {
            canvas = document.getElementById('treeCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas();
                render(); });
            canvas.addEventListener('mousedown', onMouseDown);
            canvas.addEventListener('mousemove', onMouseMove);
            canvas.addEventListener('mouseup', onMouseUp);
            canvas.addEventListener('wheel', onWheel);
            canvas.addEventListener('click', onClick);
            // Загружаем из localStorage
            loadFromStorage();
            buildFamilyFilter();
            updateStats();
            render();
            // Автовход (если пароль сохранен)
            const savedPass = localStorage.getItem('dendro_pass');
            if (savedPass === 'admin2026') {
                document.getElementById('login-overlay').classList.add('hidden');
            }
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * devicePixelRatio;
            canvas.height = rect.height * devicePixelRatio;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            ctx.scale(devicePixelRatio, devicePixelRatio);
        }

        // ============================================================
        // 4. РАСЧЕТ ПОЗИЦИЙ (простое горизонтальное дерево)
        // ============================================================
        function computeLayout() {
            const childrenMap = new Map();
            people.forEach(p => {
                if (!childrenMap.has(p.fatherId)) childrenMap.set(p.fatherId, []);
                if (p.fatherId) childrenMap.get(p.fatherId).push(p);
            });
            // Находим корень
            let root = people.find(p => p.fatherId === null);
            if (!root) root = people[0];

            const levels = [];
            const queue = [{ node: root, depth: 0 }];
            const visited = new Set();
            while (queue.length) {
                const { node, depth } = queue.shift();
                if (visited.has(node.id)) continue;
                visited.add(node.id);
                if (!levels[depth]) levels[depth] = [];
                levels[depth].push(node);
                const kids = childrenMap.get(node.id) || [];
                kids.forEach(k => queue.push({ node: k, depth: depth + 1 }));
            }

            // Выравниваем по вертикали
            const maxDepth = levels.length;
            const posMap = new Map();
            levels.forEach((level, d) => {
                const totalHeight = level.length * (NODE_H + NODE_GAP) - NODE_GAP;
                level.forEach((p, idx) => {
                    const y = (idx - (level.length - 1) / 2) * (NODE_H + NODE_GAP);
                    const x = d * (NODE_W + LVL_GAP);
                    posMap.set(p.id, { x, y });
                });
            });
            return posMap;
        }

        // ============================================================
        // 5. ОТРИСОВКА
        // ============================================================
        function render() {
            const w = canvas.width / devicePixelRatio;
            const h = canvas.height / devicePixelRatio;
            ctx.clearRect(0, 0, w, h);

            // Собираем позиции
            const posMap = computeLayout();
            nodePositions = posMap;

            // Центрируем
            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            posMap.forEach(pos => {
                if (pos.x < minX) minX = pos.x;
                if (pos.x > maxX) maxX = pos.x;
                if (pos.y < minY) minY = pos.y;
                if (pos.y > maxY) maxY = pos.y;
            });
            const treeW = maxX - minX + NODE_W;
            const treeH = maxY - minY + NODE_H;
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;

            // Применяем смещение и масштаб
            ctx.save();
            ctx.translate(w / 2, h / 2);
            ctx.scale(scale, scale);
            ctx.translate(-cx + offsetX, -cy + offsetY);

            // Рисуем линии
            people.forEach(p => {
                if (!p.fatherId) return;
                const from = posMap.get(p.fatherId);
                const to = posMap.get(p.id);
                if (!from || !to) return;
                ctx.beginPath();
                ctx.moveTo(from.x + NODE_W / 2, from.y);
                ctx.lineTo(from.x + NODE_W / 2 + (to.x - from.x - NODE_W) / 2, from.y);
                ctx.lineTo(from.x + NODE_W / 2 + (to.x - from.x - NODE_W) / 2, to.y);
                ctx.lineTo(to.x, to.y);
                ctx.strokeStyle = '#4a3a2a';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            // Рисуем карточки
            people.forEach(p => {
                const pos = posMap.get(p.id);
                if (!pos) return;
                const x = pos.x;
                const y = pos.y - NODE_H / 2;
                const isHighlight = highlightIds.has(p.id);
                const isDim = dimFamily && p.family !== dimFamily;
                const color = familyColors[p.family] || '#5a4a3a';

                ctx.globalAlpha = isDim ? 0.25 : 1;
                // Тень
                ctx.shadowColor = isHighlight ? '#d4a843' : 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = isHighlight ? 24 : 8;
                // Фон
                ctx.fillStyle = isHighlight ? '#3d2d0a' : '#1a150e';
                ctx.strokeStyle = isHighlight ? '#d4a843' : color;
                ctx.lineWidth = isHighlight ? 3 : 1.5;
                roundRect(ctx, x, y, NODE_W, NODE_H, 8);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;
                // Имя
                ctx.fillStyle = isHighlight ? '#f0d080' : '#e0d5c0';
                ctx.font = '16px "Segoe UI", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.name, x + NODE_W / 2, y + NODE_H / 2 - 6);
                // Семья (мелко)
                ctx.fillStyle = isDim ? '#4a3a2a' : '#8a7a5a';
                ctx.font = '10px "Segoe UI", sans-serif';
                ctx.fillText(p.family, x + NODE_W / 2, y + NODE_H / 2 + 14);
                ctx.globalAlpha = 1;
            });

            ctx.restore();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ============================================================
        // 6. ПОИСК И ФИЛЬТРЫ
        // ============================================================
        function searchByName(query) {
            highlightIds.clear();
            dimFamily = null;
            if (!query.trim()) {
                render();
                return;
            }
            const q = query.trim().toLowerCase();
            people.forEach(p => {
                if (p.name.toLowerCase().includes(q)) {
                    highlightIds.add(p.id);
                    // Добавляем предков
                    let cur = p;
                    while (cur.fatherId) {
                        const father = people.find(pp => pp.id === cur.fatherId);
                        if (!father) break;
                        highlightIds.add(father.id);
                        cur = father;
                    }
                }
            });
            render();
        }

        function filterByFamily(family) {
            dimFamily = family || null;
            highlightIds.clear();
            render();
        }

        function resetView() {
            highlightIds.clear();
            dimFamily = null;
            document.getElementById('searchInput').value = '';
            document.getElementById('familyFilter').value = '';
            offsetX = 0;
            offsetY = 0;
            scale = 1;
            render();
        }

        // ============================================================
        // 7. ВЗАИМОДЕЙСТВИЕ (мышь, клик, тултип)
        // ============================================================
        function onMouseDown(e) {
            isDragging = true;
            const rect = canvas.getBoundingClientRect();
            dragStartX = e.clientX - rect.left;
            dragStartY = e.clientY - rect.top;
            dragStartOffX = offsetX;
            dragStartOffY = offsetY;
            canvas.style.cursor = 'grabbing';
        }

        function onMouseMove(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            if (isDragging) {
                const dx = mx - dragStartX;
                const dy = my - dragStartY;
                offsetX = dragStartOffX + dx / scale;
                offsetY = dragStartOffY + dy / scale;
                render();
            } else {
                // Тултип
                const pos = getMousePos(e);
                let found = null;
                nodePositions.forEach((pos2, id) => {
                    const px = (pos2.x * scale + (canvas.width / 2 / devicePixelRatio - (nodePositions.get([...nodePositions
                        .keys()][0])?.x || 0) * scale + offsetX * scale));
                    // упростим: проверяем попадание
                });
                // Упрощенно показываем тултип только при клике
            }
        }

        function onMouseUp(e) {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        function onWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            scale = Math.min(Math.max(scale * delta, 0.2), 3);
            render();
        }

        function onClick(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) / devicePixelRatio;
            const my = (e.clientY - rect.top) / devicePixelRatio;
            // Преобразуем в координаты дерева
            const w = canvas.width / devicePixelRatio;
            const h = canvas.height / devicePixelRatio;
            // Инвертируем трансформацию
            const tx = (mx - w / 2) / scale + (nodePositions.get([...nodePositions.keys()][0])?.x || 0) - offsetX;
            const ty = (my - h / 2) / scale + (nodePositions.get([...nodePositions.keys()][0])?.y || 0) - offsetY;
            // Ищем ближайший узел
            let found = null;
            let minDist = 60;
            nodePositions.forEach((pos, id) => {
                const dx = pos.x + NODE_W / 2 - tx;
                const dy = pos.y - ty;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    found = id;
                }
            });
            if (found) {
                const p = people.find(pp => pp.id === found);
                if (p) showTooltip(e.clientX, e.clientY, p);
                // Показываем предков
                highlightIds.clear();
                let cur = p;
                while (cur) {
                    highlightIds.add(cur.id);
                    const father = people.find(pp => pp.id === cur.fatherId);
                    cur = father;
                }
                render();
            }
        }

        function showTooltip(clientX, clientY, p) {
            const tip = document.getElementById('tooltip');
            document.getElementById('tipName').textContent = p.name;
            document.getElementById('tipFamily').textContent = 'Семья: ' + p.family;
            // Цепочка предков
            let chain = [];
            let cur = p;
            while (cur) {
                chain.push(cur.name);
                const father = people.find(pp => pp.id === cur.fatherId);
                cur = father;
            }
            document.getElementById('tipLineage').textContent = 'Предки: ' + chain.join(' → ');
            tip.style.display = 'block';
            tip.style.left = (clientX + 16) + 'px';
            tip.style.top = (clientY - 10) + 'px';
            setTimeout(() => { tip.style.display = 'none'; }, 4000);
        }

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        // ============================================================
        // 8. АДМИНКА
        // ============================================================
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                populateSelects();
            }
        }

        function populateSelects() {
            const fatherSel = document.getElementById('fatherSelect');
            const editSel = document.getElementById('editSelect');
            fatherSel.innerHTML = '';
            editSel.innerHTML = '';
            people.forEach(p => {
                const opt1 = document.createElement('option');
                opt1.value = p.id;
                opt1.textContent = p.name + ' (' + p.family + ')';
                fatherSel.appendChild(opt1);
                const opt2 = document.createElement('option');
                opt2.value = p.id;
                opt2.textContent = p.name + ' (' + p.family + ')';
                editSel.appendChild(opt2);
            });
        }

        function addSon() {
            const fatherId = document.getElementById('fatherSelect').value;
            const name = document.getElementById('newSonName').value.trim();
            const family = document.getElementById('newSonFamily').value.trim();
            if (!name || !family) { alert('Введите имя и семью!'); return; }
            const newId = 'p' + Date.now();
            people.push({ id: newId, name, family, fatherId });
            saveToStorage();
            buildFamilyFilter();
            updateStats();
            populateSelects();
            render();
            document.getElementById('newSonName').value = '';
            document.getElementById('newSonFamily').value = '';
            alert('Добавлен ' + name);
        }

        function editPerson() {
            const id = document.getElementById('editSelect').value;
            const name = document.getElementById('editName').value.trim();
            const family = document.getElementById('editFamily').value.trim();
            const p = people.find(pp => pp.id === id);
            if (!p) return;
            if (name) p.name = name;
            if (family) p.family = family;
            saveToStorage();
            buildFamilyFilter();
            updateStats();
            populateSelects();
            render();
            alert('Обновлено!');
        }

        // ============================================================
        // 9. ХРАНЕНИЕ В LOCALSTORAGE
        // ============================================================
        function saveToStorage() {
            try {
                localStorage.setItem('dendro_people', JSON.stringify(people));
            } catch (e) { console.warn('Storage error'); }
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem('dendro_people');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed && parsed.length) people = parsed;
                }
            } catch (e) { console.warn('Load error'); }
        }

        // ============================================================
        // 10. ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
        // ============================================================
        function buildFamilyFilter() {
            const families = [...new Set(people.map(p => p.family))];
            const sel = document.getElementById('familyFilter');
            const current = sel.value;
            sel.innerHTML = '<option value="">Все семьи (гары)</option>';
            families.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                sel.appendChild(opt);
            });
            sel.value = current;
        }

        function updateStats() {
            document.getElementById('stats').textContent = people.length + ' человек';
        }

        function checkLogin() {
            const pass = document.getElementById('loginPass').value;
            if (pass === 'admin2026') {
                document.getElementById('login-overlay').classList.add('hidden');
                localStorage.setItem('dendro_pass', 'admin2026');
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        // ============================================================
        // 11. ЗАПУСК
        // ============================================================
        window.onload = init;
    </script>
</body>
</html>
