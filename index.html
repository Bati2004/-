<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Генеалогическое древо тейпа Хьачарой</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Inter', Arial, sans-serif;
    color: #111827;
    background: #ffffff;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid #e5e7eb;
    background: #ffffff;
    flex-wrap: wrap;
    z-index: 10;
  }
  header h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    color: #111827;
    white-space: nowrap;
  }
  header .spacer { flex: 1 1 auto; }
  input[type="text"], select {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    outline: none;
    background: #fff;
    color: #111827;
  }
  input[type="text"]:focus, select:focus { border-color: #2563eb; }
  #searchInput { width: 180px; }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    padding: 7px 14px;
    border-radius: 6px;
    border: 1px solid #2563eb;
    background: #fff;
    color: #2563eb;
    cursor: pointer;
  }
  button:hover { background: #eff6ff; }
  button.active { background: #2563eb; color: #fff; }
  button.primary { background: #2563eb; color: #fff; }
  button.primary:hover { background: #1d4ed8; }
  button.secondary { border-color: #d1d5db; color: #374151; }
  button.secondary:hover { background: #f3f4f6; }
  button.danger { border-color: #dc2626; color: #dc2626; }

  #canvasWrap {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    background: #fafafa;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: grab;
  }
  canvas.dragging { cursor: grabbing; }

  .overlay {
    position: fixed; inset: 0;
    background: rgba(17, 24, 39, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .overlay.show { display: flex; }
  .box {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    width: 100%;
    max-width: 320px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .box h2 {
    font-size: 16px;
    margin: 0 0 16px 0;
    color: #111827;
  }
  .box p.err {
    color: #dc2626;
    font-size: 12px;
    margin: 6px 0 0 0;
    min-height: 14px;
  }
  .box input[type="password"] {
    width: 100%;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    outline: none;
  }
  .box input[type="password"]:focus { border-color: #2563eb; }
  .box .row { display: flex; gap: 8px; margin-top: 16px; }
  .box .row button { flex: 1 1 auto; }

  #adminModal .box p.name {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 18px 0;
  }
  #adminModal .box .row { flex-direction: column; }

  #legend {
    position: absolute;
    bottom: 10px;
    left: 10px;
    font-size: 11px;
    color: #9ca3af;
    background: rgba(255,255,255,0.85);
    padding: 4px 8px;
    border-radius: 6px;
    pointer-events: none;
  }

  @media (max-width: 640px) {
    header h1 { display: none; }
    #searchInput { width: 130px; }
  }
</style>
</head>
<body>

<header>
  <h1>Тейп Хьачарой</h1>
  <input type="text" id="searchInput" placeholder="Поиск по имени / фамилии">
  <select id="familyFilter"><option value="all">Все семьи</option></select>
  <div class="spacer"></div>
  <button id="adminBtn">Админ</button>
</header>

<div id="canvasWrap">
  <canvas id="treeCanvas"></canvas>
  <div id="legend">Колесо / щипок — масштаб. Перетаскивание — перемещение. Клик по карточке — предки.</div>
</div>

<!-- Login overlay -->
<div class="overlay show" id="loginOverlay">
  <div class="box">
    <h2>Вход</h2>
    <input type="password" id="passwordInput" placeholder="Пароль администратора">
    <p class="err" id="loginError"></p>
    <div class="row">
      <button class="secondary" id="guestBtn">Как гость</button>
      <button class="primary" id="loginBtn">Войти</button>
    </div>
  </div>
</div>

<!-- Admin action modal -->
<div class="overlay" id="adminModal">
  <div class="box">
    <h2>Действие</h2>
    <p class="name" id="adminModalName"></p>
    <div class="row">
      <button class="secondary" id="btnEdit">Изменить</button>
      <button class="secondary" id="btnAddSon">Добавить сына</button>
      <button class="danger" id="btnCloseAdmin">Отмена</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ADMIN_PASSWORD = "admin2026";
  var STORAGE_KEY = "khacharoyTreeData";

  var DEFAULT_DATA = [
    { id: 'root1', name: 'Корень', family: '', fatherId: null }
  ];

  var NODE_W = 150, NODE_H = 64, NODE_GAP_X = 26, LEVEL_GAP_Y = 110;
  var MIN_SCALE = 0.15, MAX_SCALE = 3;

  var people = [];
  var peopleById = {};
  var positions = {};
  var scale = 1, offsetX = 0, offsetY = 0;
  var isAdmin = false;
  var currentFamilyFilter = "all";
  var ancestorHighlight = new Set();
  var searchHighlight = new Set();
  var currentAdminTarget = null;

  var canvas = document.getElementById('treeCanvas');
  var ctx = canvas.getContext('2d');
  var canvasWrap = document.getElementById('canvasWrap');

  var loginOverlay = document.getElementById('loginOverlay');
  var passwordInput = document.getElementById('passwordInput');
  var loginError = document.getElementById('loginError');
  var loginBtn = document.getElementById('loginBtn');
  var guestBtn = document.getElementById('guestBtn');
  var adminBtn = document.getElementById('adminBtn');

  var adminModal = document.getElementById('adminModal');
  var adminModalName = document.getElementById('adminModalName');
  var btnEdit = document.getElementById('btnEdit');
  var btnAddSon = document.getElementById('btnAddSon');
  var btnCloseAdmin = document.getElementById('btnCloseAdmin');

  var searchInput = document.getElementById('searchInput');
  var familyFilter = document.getElementById('familyFilter');

  // ---------- Data ----------

  function loadData(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length){
          people = parsed;
          return;
        }
      }
    } catch(e){}
    people = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }

  function saveData(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(people)); } catch(e){}
  }

  function refreshIndex(){
    peopleById = {};
    people.forEach(function(p){ peopleById[p.id] = p; });
  }

  // ---------- Layout ----------

  function buildLayout(){
    var childrenMap = {};
    people.forEach(function(p){ childrenMap[p.id] = []; });
    people.forEach(function(p){
      if(p.fatherId && childrenMap[p.fatherId]) childrenMap[p.fatherId].push(p);
    });
    var roots = people.filter(function(p){ return !p.fatherId; });

    var pos = {};
    var nextSlot = 0;

    function layoutNode(node, depth){
      var children = childrenMap[node.id] || [];
      var x;
      if(children.length === 0){
        x = nextSlot * (NODE_W + NODE_GAP_X);
        nextSlot++;
      } else {
        var sum = 0;
        for(var i=0;i<children.length;i++){
          sum += layoutNode(children[i], depth+1);
        }
        x = sum / children.length;
      }
      pos[node.id] = { x: x, y: depth * LEVEL_GAP_Y };
      return x;
    }

    roots.forEach(function(r){ layoutNode(r, 0); });
    return pos;
  }

  function rebuild(){
    refreshIndex();
    positions = buildLayout();
    populateFamilyFilter();
    draw();
  }

  function centerView(){
    var xs = Object.keys(positions).map(function(id){ return positions[id].x; });
    if(!xs.length) return;
    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var mid = (minX + maxX) / 2;
    var rect = canvasWrap.getBoundingClientRect();
    offsetX = rect.width / 2 - mid * scale;
    offsetY = 50;
  }

  // ---------- Colors ----------

  var colorCache = {};
  function familyColor(family){
    if(!family) return { fill: '#eef0f3', stroke: '#9aa3af' };
    if(colorCache[family]) return colorCache[family];
    var hash = 0;
    for(var i=0;i<family.length;i++){
      hash = family.charCodeAt(i) + ((hash << 5) - hash);
    }
    var hue = Math.abs(hash) % 360;
    var c = {
      fill: 'hsl(' + hue + ', 55%, 87%)',
      stroke: 'hsl(' + hue + ', 45%, 45%)'
    };
    colorCache[family] = c;
    return c;
  }

  // ---------- Drawing ----------

  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function truncate(c, text, maxWidth){
    if(c.measureText(text).width <= maxWidth) return text;
    var t = text;
    while(t.length > 1 && c.measureText(t + '…').width > maxWidth){
      t = t.slice(0, -1);
    }
    return t + '…';
  }

  function resizeCanvas(){
    var dpr = window.devicePixelRatio || 1;
    var rect = canvasWrap.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    draw();
  }

  function draw(){
    var dpr = window.devicePixelRatio || 1;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var rect = canvasWrap.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.save();
    ctx.translate(offsetX, offsetY);
    ctx.scale(scale, scale);

    // edges
    ctx.strokeStyle = '#cbd5e1';
    ctx.lineWidth = 1.5;
    people.forEach(function(p){
      if(p.fatherId && positions[p.fatherId] && positions[p.id]){
        var a = positions[p.fatherId], b = positions[p.id];
        var midY = a.y + NODE_H + (LEVEL_GAP_Y - NODE_H) / 2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y + NODE_H);
        ctx.lineTo(a.x, midY);
        ctx.lineTo(b.x, midY);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
      }
    });

    // nodes
    people.forEach(function(p){
      var pos = positions[p.id];
      if(!pos) return;
      var dimmed = currentFamilyFilter !== 'all' && p.family !== currentFamilyFilter;
      ctx.globalAlpha = dimmed ? 0.25 : 1;

      var x = pos.x - NODE_W/2, y = pos.y;
      var colors = familyColor(p.family);
      ctx.fillStyle = colors.fill;
      roundRect(ctx, x, y, NODE_W, NODE_H, 8);
      ctx.fill();

      var borderColor = colors.stroke, borderWidth = 1.5;
      if(ancestorHighlight.has(p.id)){ borderColor = '#2563eb'; borderWidth = 3; }
      if(searchHighlight.has(p.id)){ borderColor = '#f59e0b'; borderWidth = 3; }
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = borderWidth;
      roundRect(ctx, x, y, NODE_W, NODE_H, 8);
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#111827';
      ctx.font = '600 14px Arial';
      var nameY = p.family ? pos.y + NODE_H/2 - 9 : pos.y + NODE_H/2;
      ctx.fillText(truncate(ctx, p.name, NODE_W - 16), pos.x, nameY);

      if(p.family){
        ctx.font = '400 10px Arial';
        ctx.fillStyle = '#6b7280';
        ctx.fillText(truncate(ctx, p.family, NODE_W - 16), pos.x, pos.y + NODE_H/2 + 11);
      }
      ctx.globalAlpha = 1;
    });

    ctx.restore();
  }

  // ---------- Family filter / search ----------

  function populateFamilyFilter(){
    var families = new Set();
    people.forEach(function(p){ if(p.family) families.add(p.family); });
    var sorted = Array.from(families).sort();
    var prev = familyFilter.value || 'all';
    familyFilter.innerHTML = '<option value="all">Все семьи</option>';
    sorted.forEach(function(f){
      var opt = document.createElement('option');
      opt.value = f; opt.textContent = f;
      familyFilter.appendChild(opt);
    });
    if(sorted.indexOf(prev) !== -1 || prev === 'all'){
      familyFilter.value = prev;
      currentFamilyFilter = prev;
    } else {
      familyFilter.value = 'all';
      currentFamilyFilter = 'all';
    }
  }

  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim().toLowerCase();
    searchHighlight.clear();
    if(q){
      people.forEach(function(p){
        if(p.name.toLowerCase().indexOf(q) !== -1 ||
           (p.family && p.family.toLowerCase().indexOf(q) !== -1)){
          searchHighlight.add(p.id);
        }
      });
    }
    draw();
  });

  familyFilter.addEventListener('change', function(){
    currentFamilyFilter = familyFilter.value;
    draw();
  });

  // ---------- Selection / admin ----------

  function selectPerson(person){
    ancestorHighlight.clear();
    var cur = person;
    while(cur){
      ancestorHighlight.add(cur.id);
      cur = cur.fatherId ? peopleById[cur.fatherId] : null;
    }
    draw();
  }

  function openAdminDialog(person){
    currentAdminTarget = person;
    adminModalName.textContent = person.name + (person.family ? ' ' + person.family : '');
    adminModal.classList.add('show');
  }

  function closeAdminDialog(){
    adminModal.classList.remove('show');
    currentAdminTarget = null;
  }

  btnCloseAdmin.addEventListener('click', closeAdminDialog);

  btnEdit.addEventListener('click', function(){
    if(!currentAdminTarget) return;
    var newName = prompt('Имя:', currentAdminTarget.name);
    if(newName === null) return;
    var newFamily = prompt('Фамилия (можно оставить пустым):', currentAdminTarget.family || '');
    if(newFamily === null) return;
    currentAdminTarget.name = newName.trim();
    currentAdminTarget.family = newFamily.trim();
    saveData();
    closeAdminDialog();
    rebuild();
  });

  btnAddSon.addEventListener('click', function(){
    if(!currentAdminTarget) return;
    var newName = prompt('Имя нового сына:');
    if(!newName || !newName.trim()) return;
    var newId = 'p' + Date.now() + Math.floor(Math.random()*1000);
    people.push({ id: newId, name: newName.trim(), family: '', fatherId: currentAdminTarget.id });
    saveData();
    closeAdminDialog();
    rebuild();
  });

  function handleTap(clientX, clientY){
    var rect = canvasWrap.getBoundingClientRect();
    var sx = clientX - rect.left, sy = clientY - rect.top;
    var wx = (sx - offsetX) / scale, wy = (sy - offsetY) / scale;
    var hit = null;
    for(var id in positions){
      var pos = positions[id];
      var left = pos.x - NODE_W/2, top = pos.y;
      if(wx >= left && wx <= left + NODE_W && wy >= top && wy <= top + NODE_H){
        hit = peopleById[id];
        break;
      }
    }
    if(!hit) return;
    if(isAdmin){ openAdminDialog(hit); } else { selectPerson(hit); }
  }

  // ---------- Login ----------

  function showLogin(){
    loginOverlay.classList.add('show');
    loginError.textContent = '';
    passwordInput.value = '';
    passwordInput.focus();
  }
  function hideLogin(){ loginOverlay.classList.remove('show'); }

  function updateAdminButton(){
    adminBtn.textContent = isAdmin ? 'Админ: вкл' : 'Админ';
    adminBtn.classList.toggle('active', isAdmin);
  }

  loginBtn.addEventListener('click', function(){
    if(passwordInput.value === ADMIN_PASSWORD){
      isAdmin = true;
      updateAdminButton();
      hideLogin();
    } else {
      loginError.textContent = 'Неверный пароль';
    }
  });
  passwordInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter') loginBtn.click();
  });
  guestBtn.addEventListener('click', function(){
    isAdmin = false;
    updateAdminButton();
    hideLogin();
  });
  adminBtn.addEventListener('click', function(){
    if(isAdmin){
      isAdmin = false;
      updateAdminButton();
    } else {
      showLogin();
    }
  });

  // ---------- Pan / zoom (mouse) ----------

  var isDragging = false, dragMoved = false;
  var mouseDownPos = {x:0,y:0}, lastMouse = {x:0,y:0};

  canvas.addEventListener('mousedown', function(e){
    isDragging = true; dragMoved = false;
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    mouseDownPos.x = e.clientX; mouseDownPos.y = e.clientY;
    canvas.classList.add('dragging');
  });
  window.addEventListener('mousemove', function(e){
    if(!isDragging) return;
    var dx = e.clientX - lastMouse.x, dy = e.clientY - lastMouse.y;
    if(Math.abs(e.clientX - mouseDownPos.x) > 4 || Math.abs(e.clientY - mouseDownPos.y) > 4) dragMoved = true;
    offsetX += dx; offsetY += dy;
    lastMouse.x = e.clientX; lastMouse.y = e.clientY;
    draw();
  });
  window.addEventListener('mouseup', function(e){
    if(isDragging && !dragMoved){
      handleTap(e.clientX, e.clientY);
    }
    isDragging = false;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    var rect = canvasWrap.getBoundingClientRect();
    var mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var factor = e.deltaY < 0 ? 1.1 : 0.9;
    var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale * factor));
    offsetX = mx - ((mx - offsetX) / scale) * newScale;
    offsetY = my - ((my - offsetY) / scale) * newScale;
    scale = newScale;
    draw();
  }, { passive: false });

  // ---------- Pan / zoom (touch) ----------

  var touchDragging = false, touchMoved = false;
  var touchStart = {x:0,y:0}, touchLast = {x:0,y:0};
  var pinching = false, pinchStartDist = 0, pinchStartScale = 1;
  var pinchStartOffset = {x:0,y:0}, pinchMid = {x:0,y:0};

  function dist(t1, t2){
    var dx = t1.clientX - t2.clientX, dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }
  function midpoint(t1, t2){
    return { x: (t1.clientX + t2.clientX)/2, y: (t1.clientY + t2.clientY)/2 };
  }

  canvas.addEventListener('touchstart', function(e){
    if(e.touches.length === 1){
      touchDragging = true; touchMoved = false; pinching = false;
      touchStart.x = touchLast.x = e.touches[0].clientX;
      touchStart.y = touchLast.y = e.touches[0].clientY;
    } else if(e.touches.length === 2){
      touchDragging = false; pinching = true;
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartScale = scale;
      pinchStartOffset.x = offsetX; pinchStartOffset.y = offsetY;
      pinchMid = midpoint(e.touches[0], e.touches[1]);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', function(e){
    e.preventDefault();
    if(pinching && e.touches.length === 2){
      var d = dist(e.touches[0], e.touches[1]);
      var newScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, pinchStartScale * (d / pinchStartDist)));
      var rect = canvasWrap.getBoundingClientRect();
      var mx = pinchMid.x - rect.left, my = pinchMid.y - rect.top;
      offsetX = mx - ((mx - pinchStartOffset.x) / pinchStartScale) * newScale;
      offsetY = my - ((my - pinchStartOffset.y) / pinchStartScale) * newScale;
      scale = newScale;
      draw();
    } else if(touchDragging && e.touches.length === 1){
      var dx = e.touches[0].clientX - touchLast.x, dy = e.touches[0].clientY - touchLast.y;
      if(Math.abs(e.touches[0].clientX - touchStart.x) > 4 || Math.abs(e.touches[0].clientY - touchStart.y) > 4) touchMoved = true;
      offsetX += dx; offsetY += dy;
      touchLast.x = e.touches[0].clientX; touchLast.y = e.touches[0].clientY;
      draw();
    }
  }, { passive: false });

  canvas.addEventListener('touchend', function(e){
    if(e.touches.length === 0){
      if(touchDragging && !touchMoved){
        handleTap(touchStart.x, touchStart.y);
      }
      touchDragging = false; pinching = false;
    } else if(e.touches.length === 1){
      pinching = false; touchDragging = true;
      touchLast.x = e.touches[0].clientX; touchLast.y = e.touches[0].clientY;
      touchStart.x = touchLast.x; touchStart.y = touchLast.y;
      touchMoved = true;
    }
  }, { passive: true });

  // ---------- Init ----------

  window.addEventListener('resize', resizeCanvas);

  loadData();
  rebuild();
  resizeCanvas();
  centerView();
  draw();
  updateAdminButton();
  showLogin();

})();
</script>
</body>
</html>
