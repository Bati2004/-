<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Древо тейпа Хачиро</title>
    <!-- Подключаем красивые шрифты -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
            background: #0a0806;
            overflow: hidden;
            height: 100vh;
            position: fixed;
            width: 100%;
            touch-action: none;
        }

        /* Эффект старого пергамента */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(80, 55, 30, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(60, 40, 20, 0.2) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(40, 30, 20, 0.08) 2px, rgba(40, 30, 20, 0.08) 4px);
            pointer-events: none;
            z-index: 0;
        }

        /* Шапка с восточным стилем */
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: linear-gradient(180deg, rgba(10, 8, 6, 0.98) 0%, rgba(10, 8, 6, 0.92) 100%);
            padding: 12px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid #b8860b;
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.9), inset 0 0 60px rgba(40, 30, 15, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        #header h1 {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 22px;
            font-weight: 700;
            font-style: italic;
            color: #d4a843;
            text-shadow: 0 0 40px rgba(212, 168, 67, 0.12), 0 2px 4px rgba(0, 0, 0, 0.5);
            letter-spacing: 5px;
            margin-right: 14px;
            white-space: nowrap;
            position: relative;
        }
        #header h1::after {
            content: '✦';
            font-style: normal;
            font-size: 14px;
            color: #6a5a3a;
            margin-left: 10px;
        }
        #header h1 span {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 400;
            font-style: italic;
            color: #7a6a4a;
            font-size: 14px;
            letter-spacing: 3px;
        }
        #searchInput {
            flex: 1;
            min-width: 130px;
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid #3a2a1a;
            background: rgba(20, 15, 10, 0.85);
            color: #e8ddd0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
            outline: none;
            transition: all 0.4s;
            letter-spacing: 0.5px;
        }
        #searchInput:focus {
            border-color: #d4a843;
            box-shadow: 0 0 30px rgba(212, 168, 67, 0.08);
            background: rgba(25, 18, 12, 0.95);
        }
        #searchInput::placeholder {
            color: #5a4a3a;
            font-style: italic;
            letter-spacing: 1px;
        }
        #familyFilter {
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #3a2a1a;
            background: rgba(20, 15, 10, 0.85);
            color: #e8ddd0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-style: italic;
            outline: none;
            cursor: pointer;
            max-width: 150px;
            transition: 0.3s;
            letter-spacing: 0.5px;
        }
        #familyFilter:focus {
            border-color: #d4a843;
        }
        #familyFilter option {
            background: #1a150e;
            font-style: normal;
        }
        .header-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid #4a3a2a;
            background: rgba(30, 20, 10, 0.6);
            color: #aa9a7a;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-style: italic;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .header-btn:hover {
            background: rgba(50, 35, 20, 0.8);
            border-color: #b8860b;
            color: #d4a843;
            transform: scale(1.03);
            box-shadow: 0 0 25px rgba(212, 168, 67, 0.05);
        }
        .header-btn.admin {
            border-color: #6a2a1a;
            color: #8a5a3a;
            font-style: normal;
        }
        .header-btn.admin:hover {
            border-color: #aa3a1a;
            color: #d46a3a;
            box-shadow: 0 0 30px rgba(180, 50, 20, 0.08);
        }
        #stats {
            color: #5a4a3a;
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            font-style: italic;
            white-space: nowrap;
            margin-left: 4px;
            letter-spacing: 1px;
        }

        /* Канвас */
        #canvas-wrapper {
            position: fixed;
            top: 72px;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            touch-action: none;
        }
        #treeCanvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: grab;
        }
        #treeCanvas:active {
            cursor: grabbing;
        }

        /* Тултип с восточным стилем */
        #tooltip {
            position: fixed;
            display: none;
            background: rgba(12, 10, 8, 0.98);
            border: 1px solid #b8860b;
            border-radius: 16px;
            padding: 20px 28px;
            min-width: 240px;
            pointer-events: none;
            z-index: 200;
            box-shadow: 0 8px 60px rgba(0, 0, 0, 0.95), inset 0 0 60px rgba(60, 40, 20, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            animation: tooltipIn 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes tooltipIn {
            0% {
                opacity: 0;
                transform: translateY(-12px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        #tooltip .name {
            font-family: 'Playfair Display', 'Georgia', serif;
            font-size: 26px;
            font-weight: 700;
            font-style: italic;
            color: #d4a843;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(212, 168, 67, 0.06);
        }
        #tooltip .family {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
            color: #aa9a7a;
            margin-top: 2px;
            letter-spacing: 1px;
        }
        #tooltip .family::before {
            content: '◈ ';
            color: #5a4a3a;
            font-style: normal;
        }
        #tooltip .lineage {
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            color: #6a5a4a;
            margin-top: 10px;
            border-top: 1px solid #2a1f0e;
            padding-top: 10px;
            font-style: italic;
            letter-spacing: 0.5px;
        }
        #tooltip .lineage span {
            color: #aa8a5a;
            font-style: normal;
            font-weight: 600;
        }

        /* Админ-панель */
        #admin-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 150;
            display: none;
            background: rgba(10, 8, 6, 0.99);
            border: 1px solid #b8860b;
            border-radius: 18px;
            padding: 26px 30px;
            min-width: 320px;
            max-width: 92vw;
            max-height: 80vh;
            overflow-y: auto;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 70px rgba(0, 0, 0, 0.98), inset 0 0 60px rgba(40, 30, 15, 0.03);
            animation: panelIn 0.3s ease-out;
        }
        @keyframes panelIn {
            0% {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        #admin-panel.active {
            display: block;
        }
        #admin-panel::-webkit-scrollbar {
            width: 4px;
        }
        #admin-panel::-webkit-scrollbar-track {
            background: #0d0a08;
        }
        #admin-panel::-webkit-scrollbar-thumb {
            background: #5a4a2a;
            border-radius: 2px;
        }
        #admin-panel h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            color: #d4a843;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 18px;
            border-bottom: 1px solid #2a1f0e;
            padding-bottom: 12px;
        }
        #admin-panel label {
            display: block;
            margin: 14px 0 4px;
            color: #8a7a5a;
            font-family: 'Cormorant Garamond', serif;
            font-size: 13px;
            font-style: italic;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        #admin-panel select,
        #admin-panel input {
            width: 100%;
            padding: 10px 16px;
            border-radius: 10px;
            border: 1px solid #2a1f0e;
            background: #14100a;
            color: #e8ddd0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
            outline: none;
            transition: 0.3s;
        }
        #admin-panel select:focus,
        #admin-panel input:focus {
            border-color: #b8860b;
            box-shadow: 0 0 20px rgba(212, 168, 67, 0.04);
        }
        #admin-panel select option {
            font-style: normal;
            background: #14100a;
        }
        .admin-btn-submit {
            margin-top: 18px;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #2a1f0e, #1a150e);
            border: 1px solid #b8860b;
            border-radius: 10px;
            color: #d4a843;
            font-family: 'Playfair Display', serif;
            font-size: 17px;
            font-style: italic;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .admin-btn-submit:hover {
            background: linear-gradient(135deg, #3a2f1e, #2a1f0e);
            box-shadow: 0 0 40px rgba(212, 168, 67, 0.06);
            transform: scale(1.01);
        }
        .close-admin {
            position: absolute;
            top: 14px;
            right: 20px;
            background: none;
            border: none;
            color: #5a3a2a;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: serif;
            line-height: 1;
        }
        .close-admin:hover {
            color: #8a5a3a;
            transform: rotate(90deg);
        }
        .admin-divider {
            border: none;
            border-top: 1px solid #1a150e;
            margin: 20px 0;
        }
        .admin-note {
            color: #4a3a2a;
            font-family: 'Cormorant Garamond', serif;
            font-size: 12px;
            font-style: italic;
            margin-top: 10px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Логин */
        #login-overlay {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(0, 0, 0, 0.94);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        #login-overlay.hidden {
            display: none;
        }
        #login-box {
            background: radial-gradient(ellipse at center, rgba(25, 18, 12, 0.98), rgba(8, 6, 4, 0.98));
            border: 1px solid #b8860b;
            border-radius: 24px;
            padding: 50px 44px;
            min-width: 360px;
            max-width: 92vw;
            text-align: center;
            box-shadow: 0 8px 100px rgba(0, 0, 0, 0.9), inset 0 0 80px rgba(60, 40, 20, 0.03);
            animation: loginIn 0.6s ease-out;
        }
        @keyframes loginIn {
            0% {
                opacity: 0;
                transform: scale(0.94) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        #login-box .logo {
            font-size: 54px;
            margin-bottom: 4px;
            display: block;
        }
        #login-box h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-style: italic;
            color: #d4a843;
            font-size: 34px;
            letter-spacing: 8px;
            text-shadow: 0 0 50px rgba(212, 168, 67, 0.06);
        }
        #login-box .sub {
            font-family: 'Cormorant Garamond', serif;
            color: #5a4a3a;
            font-size: 15px;
            font-style: italic;
            letter-spacing: 8px;
            margin-bottom: 30px;
            margin-top: 2px;
        }
        #login-box input {
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #2a1f0e;
            background: rgba(20, 15, 10, 0.9);
            color: #e8ddd0;
            font-family: 'Cormorant Garamond', serif;
            font-size: 20px;
            font-style: italic;
            margin-bottom: 18px;
            outline: none;
            text-align: center;
            letter-spacing: 6px;
            transition: 0.3s;
        }
        #login-box input:focus {
            border-color: #b8860b;
            box-shadow: 0 0 40px rgba(212, 168, 67, 0.04);
        }
        #login-box button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2a1f0e, #1a150e);
            border: 1px solid #b8860b;
            border-radius: 12px;
            color: #d4a843;
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-style: italic;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 4px;
        }
        #login-box button:hover {
            background: linear-gradient(135deg, #3a2f1e, #2a1f0e);
            box-shadow: 0 0 60px rgba(212, 168, 67, 0.04);
            transform: scale(1.01);
        }
        #login-error {
            color: #8a3a2a;
            font-family: 'Cormorant Garamond', serif;
            font-size: 15px;
            font-style: italic;
            margin-top: 16px;
            display: none;
            letter-spacing: 1px;
        }

        /* Адаптация */
        @media (max-width: 768px) {
            #header {
                padding: 8px 12px;
                gap: 6px;
            }
            #header h1 {
                font-size: 17px;
                letter-spacing: 3px;
            }
            #header h1::after {
                display: none;
            }
            #header h1 span {
                font-size: 12px;
            }
            #searchInput {
                font-size: 14px;
                min-width: 80px;
                padding: 6px 14px;
            }
            #familyFilter {
                font-size: 13px;
                max-width: 110px;
                padding: 6px 12px;
            }
            .header-btn {
                font-size: 13px;
                padding: 6px 12px;
            }
            #stats {
                font-size: 12px;
            }
            #admin-panel {
                bottom: 10px;
                right: 10px;
                left: 10px;
                min-width: unset;
                padding: 18px 16px;
                max-height: 65vh;
            }
            #login-box {
                padding: 32px 24px;
                min-width: unset;
                width: 94vw;
            }
            #login-box h2 {
                font-size: 28px;
                letter-spacing: 4px;
            }
            #tooltip {
                min-width: 170px;
                padding: 14px 18px;
            }
            #tooltip .name {
                font-size: 22px;
            }
            #tooltip .family {
                font-size: 14px;
            }
        }
        @media (max-width: 420px) {
            #header {
                padding: 4px 8px;
                gap: 4px;
            }
            #header h1 {
                font-size: 14px;
                letter-spacing: 1px;
                margin-right: 4px;
            }
            #searchInput {
                font-size: 12px;
                min-width: 50px;
                padding: 4px 10px;
            }
            #familyFilter {
                font-size: 11px;
                max-width: 70px;
                padding: 4px 8px;
            }
            .header-btn {
                font-size: 11px;
                padding: 4px 8px;
            }
            #stats {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Логин -->
    <div id="login-overlay">
        <div id="login-box">
            <span class="logo">⚔️</span>
            <h2>ХАЧИРО</h2>
            <div class="sub">родословная · тейп</div>
            <input type="password" id="loginPass" placeholder="✦ ✦ ✦ ✦ ✦ ✦" maxlength="20" autofocus>
            <button onclick="checkLogin()">Войти в древо</button>
            <div id="login-error">⛔ Неверный ключ доступа</div>
        </div>
    </div>

    <!-- Шапка -->
    <div id="header">
        <h1>ХАЧИРО <span>· тейп</span></h1>
        <input type="text" id="searchInput" placeholder="🔍 Поиск по имени..." oninput="searchByName(this.value)">
        <select id="familyFilter" onchange="filterByFamily(this.value)">
            <option value="">Все гары</option>
        </select>
        <button class="header-btn" onclick="resetView()">⟲ Сброс</button>
        <span id="stats">0</span>
        <button class="header-btn admin" onclick="toggleAdmin()">⚙</button>
    </div>

    <!-- Канвас -->
    <div id="canvas-wrapper">
        <canvas id="treeCanvas"></canvas>
    </div>

    <!-- Тултип -->
    <div id="tooltip">
        <div class="name" id="tipName">—</div>
        <div class="family" id="tipFamily">—</div>
        <div class="lineage" id="tipLineage">—</div>
    </div>

    <!-- Админ-панель -->
    <div id="admin-panel">
        <button class="close-admin" onclick="toggleAdmin()">✕</button>
        <h3>⚔️ Добавить сына</h3>
        <label>Отец (выбери из списка)</label>
        <select id="fatherSelect"></select>
        <label>Имя сына</label>
        <input type="text" id="newSonName" placeholder="Например: Аслан">
        <label>Семья (гар)</label>
        <input type="text" id="newSonFamily" placeholder="Например: Адаговы">
        <button class="admin-btn-submit" onclick="addSon()">➕ Добавить</button>
        <hr class="admin-divider">
        <h3>✏️ Редактировать</h3>
        <label>Выбрать человека</label>
        <select id="editSelect"></select>
        <label>Новое имя</label>
        <input type="text" id="editName" placeholder="Новое имя">
        <label>Новая семья</label>
        <input type="text" id="editFamily" placeholder="Новая семья">
        <button class="admin-btn-submit" onclick="editPerson()">💾 Сохранить</button>
        <div class="admin-note">Все изменения сохраняются в браузере</div>
    </div>

    <script>
        // ============================================================
        // 1. ДАННЫЕ — ЧИСТО! Только ОДИН пример.
        //    Ты добавишь своих 800+ человек сюда.
        // ============================================================
        let people = [
            { id: 'root1', name: 'Корень', family: 'Хачиро', fatherId: null }
        ];

        // Цвета для семей (гаров) — благородные
        const familyColors = {
            'Хачиро': '#b8860b',
            // Добавишь свои семьи с цветами:
            // 'Адаговы': '#8b1a4a',
            // 'Мирзоевы': '#1a6a5a',
            // 'Цуцаевы': '#8a6a2a',
        };

        function getFamilyColor(family) {
            if (familyColors[family]) return familyColors[family];
            const palette = ['#8b1a4a', '#1a6a5a', '#8a6a2a', '#2a4a7a', '#6a3a5a', '#3a6a4a', '#7a4a2a', '#2a5a6a'];
            const idx = Object.keys(familyColors).length % palette.length;
            familyColors[family] = palette[idx];
            return familyColors[family];
        }

        // ============================================================
        // 2. СОСТОЯНИЕ
        // ============================================================
        let highlightIds = new Set();
        let dimFamily = null;
        let scale = 1;
        let offsetX = 0,
            offsetY = 0;
        let isDragging = false;
        let dragStartX = 0,
            dragStartY = 0;
        let dragStartOffX = 0,
            dragStartOffY = 0;
        let canvas, ctx;
        let nodePositions = new Map();
        const NODE_W = 140,
            NODE_H = 54;
        const LVL_GAP = 70,
            NODE_GAP = 22;

        // ============================================================
        // 3. ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        function init() {
            canvas = document.getElementById('treeCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', () => { resizeCanvas();
                render(); });
            window.addEventListener('orientationchange', () => { setTimeout(() => { resizeCanvas();
                    render(); }, 300); });

            canvas.addEventListener('mousedown', onPointerDown);
            canvas.addEventListener('mousemove', onPointerMove);
            canvas.addEventListener('mouseup', onPointerUp);
            canvas.addEventListener('mouseleave', onPointerUp);
            canvas.addEventListener('wheel', onWheel, { passive: false });

            canvas.addEventListener('touchstart', onTouchStart, { passive: false });
            canvas.addEventListener('touchmove', onTouchMove, { passive: false });
            canvas.addEventListener('touchend', onTouchEnd, { passive: false });

            canvas.addEventListener('click', onClick);

            loadFromStorage();
            buildFamilyFilter();
            updateStats();

            setTimeout(() => {
                centerView();
                render();
            }, 150);
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
        }

        // ============================================================
        // 4. ЦЕНТРИРОВКА
        // ============================================================
        function centerView() {
            const posMap = computeLayout();
            if (posMap.size === 0) return;
            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            posMap.forEach(pos => {
                if (pos.x < minX) minX = pos.x;
                if (pos.x > maxX) maxX = pos.x;
                if (pos.y < minY) minY = pos.y;
                if (pos.y > maxY) maxY = pos.y;
            });
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const w = canvas.width / (window.devicePixelRatio || 1);
            const h = canvas.height / (window.devicePixelRatio || 1);
            const treeW = maxX - minX + NODE_W;
            const treeH = maxY - minY + NODE_H;
            const scaleX = (w - 60) / (treeW + 80);
            const scaleY = (h - 60) / (treeH + 80);
            scale = Math.min(scaleX, scaleY, 1.2);
            scale = Math.max(scale, 0.25);
            offsetX = 0;
            offsetY = 0;
        }

        // ============================================================
        // 5. РАСЧЕТ ПОЗИЦИЙ (СВЕРХУ-ВНИЗ)
        // ============================================================
        function computeLayout() {
            const childrenMap = new Map();
            people.forEach(p => {
                if (!childrenMap.has(p.fatherId)) childrenMap.set(p.fatherId, []);
                if (p.fatherId) childrenMap.get(p.fatherId).push(p);
            });
            let root = people.find(p => p.fatherId === null);
            if (!root && people.length) root = people[0];
            if (!root) return new Map();

            const levels = [];
            const queue = [{ node: root, depth: 0 }];
            const visited = new Set();
            while (queue.length) {
                const { node, depth } = queue.shift();
                if (visited.has(node.id)) continue;
                visited.add(node.id);
                if (!levels[depth]) levels[depth] = [];
                levels[depth].push(node);
                const kids = childrenMap.get(node.id) || [];
                kids.forEach(k => queue.push({ node: k, depth: depth + 1 }));
            }

            const posMap = new Map();
            levels.forEach((level, d) => {
                const totalWidth = level.length * (NODE_W + NODE_GAP) - NODE_GAP;
                level.forEach((p, idx) => {
                    const x = (idx - (level.length - 1) / 2) * (NODE_W + NODE_GAP);
                    const y = d * (NODE_H + LVL_GAP);
                    posMap.set(p.id, { x, y });
                });
            });
            return posMap;
        }

        // ============================================================
        // 6. ОТРИСОВКА С АНИМАЦИЕЙ
        // ============================================================
        let animFrame = 0;

        function render() {
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            ctx.clearRect(0, 0, w, h);

            const posMap = computeLayout();
            nodePositions = posMap;
            if (posMap.size === 0) return;

            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            posMap.forEach(pos => {
                if (pos.x < minX) minX = pos.x;
                if (pos.x > maxX) maxX = pos.x;
                if (pos.y < minY) minY = pos.y;
                if (pos.y > maxY) maxY = pos.y;
            });
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;

            ctx.save();
            ctx.translate(w / 2, h / 2);
            ctx.scale(scale, scale);
            ctx.translate(-cx + offsetX, -cy + offsetY);

            // Линии
            people.forEach(p => {
                if (!p.fatherId) return;
                const from = posMap.get(p.fatherId);
                const to = posMap.get(p.id);
                if (!from || !to) return;
                const isHighlight = highlightIds.has(p.id) || highlightIds.has(p.fatherId);
                ctx.beginPath();
                const midY = from.y + NODE_H / 2 + (to.y - from.y - NODE_H) / 2;
                ctx.moveTo(from.x + NODE_W / 2, from.y + NODE_H);
                ctx.lineTo(from.x + NODE_W / 2, midY);
                ctx.lineTo(to.x + NODE_W / 2, midY);
                ctx.lineTo(to.x + NODE_W / 2, to.y);

                if (isHighlight) {
                    ctx.shadowColor = '#d4a843';
                    ctx.shadowBlur = 18;
                    ctx.strokeStyle = '#d4a843';
                    ctx.lineWidth = 2.5;
                } else {
                    ctx.shadowColor = 'rgba(0,0,0,0)';
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = '#3a2a1a';
                    ctx.lineWidth = 1.8;
                }
                ctx.stroke();
                ctx.shadowBlur = 0;
            });

            // Карточки
            const now = Date.now();
            people.forEach((p, idx) => {
                const pos = posMap.get(p.id);
                if (!pos) return;
                const x = pos.x;
                const y = pos.y;
                const isHighlight = highlightIds.has(p.id);
                const isDim = dimFamily && p.family !== dimFamily;
                const color = getFamilyColor(p.family);

                // Анимация появления
                const delay = idx * 15;
                const age = Math.max(0, (now - (window._startTime || now)) - delay);
                const appear = Math.min(1, age / 400);
                const scaleY = isDim ? 1 : (0.3 + 0.7 * appear);

                ctx.globalAlpha = isDim ? 0.15 : 1;

                // Тень
                if (isHighlight) {
                    ctx.shadowColor = '#d4a843';
                    ctx.shadowBlur = 35;
                } else {
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 15;
                }

                const grad = ctx.createLinearGradient(x, y, x + NODE_W, y + NODE_H);
                if (isHighlight) {
                    grad.addColorStop(0, '#3d2d0a');
                    grad.addColorStop(1, '#1a150e');
                } else {
                    grad.addColorStop(0, '#1a150e');
                    grad.addColorStop(1, '#0d0a08');
                }
                ctx.fillStyle = grad;

                ctx.strokeStyle = isHighlight ? '#d4a843' : color;
                ctx.lineWidth = isHighlight ? 2.5 : 1.5;

                // Анимируем появление
                const drawY = y + (1 - scaleY) * NODE_H / 2;
                const drawH = NODE_H * scaleY;
                if (drawH < 2) return;

                roundRect(ctx, x, drawY, NODE_W, drawH, 10);
                ctx.fill();
                ctx.stroke();
                ctx.shadowBlur = 0;

                // Имя
                ctx.fillStyle = isHighlight ? '#f0d080' : '#e8ddd0';
                ctx.font = 'bold 18px "Playfair Display", "Georgia", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const nameY = drawY + drawH / 2 - 4;
                ctx.fillText(p.name, x + NODE_W / 2, nameY);

                // Семья
                if (drawH > 30) {
                    ctx.fillStyle = isDim ? '#3a2a1a' : (isHighlight ? '#b89a6a' : '#6a5a4a');
                    ctx.font = '12px "Cormorant Garamond", "Georgia", serif';
                    ctx.fontStyle = 'italic';
                    ctx.fillText(p.family, x + NODE_W / 2, nameY + 20);
                }

                ctx.globalAlpha = 1;
            });

            ctx.restore();
            animFrame = requestAnimationFrame(render);
        }

        // Запускаем таймер для анимации
        window._startTime = Date.now();

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        // ============================================================
        // 7. УПРАВЛЕНИЕ (МЫШЬ + ТАЧ)
        // ============================================================
        function getCanvasCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            return {
                x: (e.clientX - rect.left) / dpr,
                y: (e.clientY - rect.top) / dpr
            };
        }

        function onPointerDown(e) {
            isDragging = true;
            const pos = getCanvasCoords(e);
            dragStartX = pos.x;
            dragStartY = pos.y;
            dragStartOffX = offsetX;
            dragStartOffY = offsetY;
            canvas.style.cursor = 'grabbing';
        }

        function onPointerMove(e) {
            if (isDragging) {
                const pos = getCanvasCoords(e);
                const dx = (pos.x - dragStartX) / scale;
                const dy = (pos.y - dragStartY) / scale;
                offsetX = dragStartOffX + dx;
                offsetY = dragStartOffY + dy;
            }
        }

        function onPointerUp(e) {
            isDragging = false;
            canvas.style.cursor = 'grab';
        }

        let touchStartX = 0,
            touchStartY = 0;
        let touchStartOffX = 0,
            touchStartOffY = 0;
        let lastTouchDist = 0;
        let isTouchDragging = false;

        function onTouchStart(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1) {
                isTouchDragging = true;
                touchStartX = touches[0].clientX;
                touchStartY = touches[0].clientY;
                touchStartOffX = offsetX;
                touchStartOffY = offsetY;
            } else if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                lastTouchDist = Math.sqrt(dx * dx + dy * dy);
            }
        }

        function onTouchMove(e) {
            e.preventDefault();
            const touches = e.touches;
            if (touches.length === 1 && isTouchDragging) {
                const dx = (touches[0].clientX - touchStartX) / scale;
                const dy = (touches[0].clientY - touchStartY) / scale;
                offsetX = touchStartOffX + dx;
                offsetY = touchStartOffY + dy;
            } else if (touches.length === 2) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (lastTouchDist > 0) {
                    const delta = dist / lastTouchDist;
                    scale = Math.min(Math.max(scale * delta, 0.15), 3.5);
                }
                lastTouchDist = dist;
            }
        }

        function onTouchEnd(e) {
            isTouchDragging = false;
            lastTouchDist = 0;
        }

        // ============================================================
        // 8. КОЛЕСИКО
        // ============================================================
        function onWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.92 : 1.08;
            const newScale = Math.min(Math.max(scale * delta, 0.15), 3.5);
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const mx = (e.clientX - rect.left) / dpr;
            const my = (e.clientY - rect.top) / dpr;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            const ratio = newScale / scale;
            offsetX = (offsetX - (mx - w / 2) / scale) * ratio + (mx - w / 2) / newScale;
            offsetY = (offsetY - (my - h / 2) / scale) * ratio + (my - h / 2) / newScale;
            scale = newScale;
        }

        // ============================================================
        // 9. КЛИК
        // ============================================================
        function onClick(e) {
            const rect = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const mx = (e.clientX - rect.left) / dpr;
            const my = (e.clientY - rect.top) / dpr;
            const w = canvas.width / dpr;
            const h = canvas.height / dpr;

            const posMap = nodePositions;
            if (posMap.size === 0) return;

            let minX = Infinity,
                maxX = -Infinity,
                minY = Infinity,
                maxY = -Infinity;
            posMap.forEach(pos => {
                if (pos.x < minX) minX = pos.x;
                if (pos.x > maxX) maxX = pos.x;
                if (pos.y < minY) minY = pos.y;
                if (pos.y > maxY) maxY = pos.y;
            });
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;

            const tx = (mx - w / 2) / scale + cx - offsetX;
            const ty = (my - h / 2) / scale + cy - offsetY;

            let found = null;
            let minDist = 70;
            posMap.forEach((pos, id) => {
                const dx = pos.x + NODE_W / 2 - tx;
                const dy = pos.y + NODE_H / 2 - ty;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                    minDist = dist;
                    found = id;
                }
            });

            if (found) {
                const p = people.find(pp => pp.id === found);
                if (p) {
                    showTooltip(e.clientX, e.clientY, p);
                    highlightIds.clear();
                    let cur = p;
                    while (cur) {
                        highlightIds.add(cur.id);
                        const father = people.find(pp => pp.id === cur.fatherId);
                        cur = father;
                    }
                }
            } else {
                highlightIds.clear();
                document.getElementById('tooltip').style.display = 'none';
            }
        }

        // ============================================================
        // 10. ТУЛТИП
        // ============================================================
        let tooltipTimeout;

        function showTooltip(clientX, clientY, p) {
            const tip = document.getElementById('tooltip');
            document.getElementById('tipName').textContent = p.name;
            document.getElementById('tipFamily').textContent = p.family;

            let chain = [];
            let cur = p;
            while (cur) {
                chain.push(cur.name);
                const father = people.find(pp => pp.id === cur.fatherId);
                cur = father;
            }
            document.getElementById('tipLineage').innerHTML = 'Предки: <span>' + chain.join(' → ') + '</span>';

            tip.style.display = 'block';
            let left = clientX + 18;
            let top = clientY - 10;
            if (left + 250 > window.innerWidth) left = clientX - 250;
            if (top + 130 > window.innerHeight) top = window.innerHeight - 140;
            if (top < 10) top = 10;
            tip.style.left = left + 'px';
            tip.style.top = top + 'px';

            clearTimeout(tooltipTimeout);
            tooltipTimeout = setTimeout(() => {
                tip.style.display = 'none';
            }, 5000);
        }

        // ============================================================
        // 11. ПОИСК И ФИЛЬТР
        // ============================================================
        function searchByName(query) {
            highlightIds.clear();
            dimFamily = null;
            if (!query.trim()) return;
            const q = query.trim().toLowerCase();
            people.forEach(p => {
                if (p.name.toLowerCase().includes(q)) {
                    highlightIds.add(p.id);
                    let cur = p;
                    while (cur.fatherId) {
                        const father = people.find(pp => pp.id === cur.fatherId);
                        if (!father) break;
                        highlightIds.add(father.id);
                        cur = father;
                    }
                }
            });
        }

        function filterByFamily(family) {
            dimFamily = family || null;
            highlightIds.clear();
        }

        function resetView() {
            highlightIds.clear();
            dimFamily = null;
            document.getElementById('searchInput').value = '';
            document.getElementById('familyFilter').value = '';
            centerView();
            document.getElementById('tooltip').style.display = 'none';
        }

        // ============================================================
        // 12. АДМИНКА
        // ============================================================
        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) populateSelects();
        }

        function populateSelects() {
            const fatherSel = document.getElementById('fatherSelect');
            const editSel = document.getElementById('editSelect');
            fatherSel.innerHTML = '';
            editSel.innerHTML = '';
            const sorted = [...people].sort((a, b) => a.name.localeCompare(b.name));
            sorted.forEach(p => {
                const opt1 = document.createElement('option');
                opt1.value = p.id;
                opt1.textContent = p.name + ' (' + p.family + ')';
                fatherSel.appendChild(opt1);
                const opt2 = document.createElement('option');
                opt2.value = p.id;
                opt2.textContent = p.name + ' (' + p.family + ')';
                editSel.appendChild(opt2);
            });
        }

        function addSon() {
            const fatherId = document.getElementById('fatherSelect').value;
            const name = document.getElementById('newSonName').value.trim();
            const family = document.getElementById('newSonFamily').value.trim();
            if (!name || !family) { alert('⚠️ Введите имя и семью!'); return; }
            const newId = 'p' + Date.now() + Math.random().toString(36).slice(2, 6);
            people.push({ id: newId, name, family, fatherId });
            saveToStorage();
            buildFamilyFilter();
            updateStats();
            populateSelects();
            centerView();
            document.getElementById('newSonName').value = '';
            document.getElementById('newSonFamily').value = '';
            alert('✅ ' + name + ' добавлен!');
        }

        function editPerson() {
            const id = document.getElementById('editSelect').value;
            const name = document.getElementById('editName').value.trim();
            const family = document.getElementById('editFamily').value.trim();
            const p = people.find(pp => pp.id === id);
            if (!p) { alert('⚠️ Не найден'); return; }
            if (name) p.name = name;
            if (family) p.family = family;
            if (!name && !family) { alert('⚠️ Введите данные'); return; }
            saveToStorage();
            buildFamilyFilter();
            updateStats();
            populateSelects();
            alert('✅ Обновлено!');
            document.getElementById('editName').value = '';
            document.getElementById('editFamily').value = '';
        }

        // ============================================================
        // 13. ХРАНЕНИЕ
        // ============================================================
        function saveToStorage() {
            try { localStorage.setItem('dendro_people', JSON.stringify(people)); } catch (e) {}
        }

        function loadFromStorage() {
            try {
                const data = localStorage.getItem('dendro_people');
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed && parsed.length) {
                        people = parsed;
                        people.forEach(p => getFamilyColor(p.family));
                    }
                }
            } catch (e) {}
        }

        // ============================================================
        // 14. ВСПОМОГАТЕЛЬНЫЕ
        // ============================================================
        function buildFamilyFilter() {
            const families = [...new Set(people.map(p => p.family))].sort();
            const sel = document.getElementById('familyFilter');
            const current = sel.value;
            sel.innerHTML = '<option value="">Все гары</option>';
            families.forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.textContent = f;
                sel.appendChild(opt);
            });
            sel.value = current;
        }

        function updateStats() {
            document.getElementById('stats').textContent = people.length + ' чел.';
        }

        function checkLogin() {
            const pass = document.getElementById('loginPass').value;
            if (pass === 'admin2026') {
                document.getElementById('login-overlay').classList.add('hidden');
                localStorage.setItem('dendro_pass', 'admin2026');
                setTimeout(() => { centerView(); }, 200);
            } else {
                document.getElementById('login-error').style.display = 'block';
                document.getElementById('loginPass').value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('dendro_pass') === 'admin2026') {
                document.getElementById('login-overlay').classList.add('hidden');
            }
            document.getElementById('loginPass').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') checkLogin();
            });
        });

        // ============================================================
        // 15. ЗАПУСК
        // ============================================================
        window.onload = init;
    </script>
</body>
